<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="referrer" content="no-referrer"><title>Open Paper invitation</title><link rel="icon" href="data:,"><link rel="stylesheet" href="chrome.css"><style>body{min-height:100vh;display:grid;place-items:center;background:var(--surface)}main{width:min(360px,calc(100vw - 40px));padding:24px;border:1px solid var(--line);border-radius:12px}h1{font-size:18px;margin:0 0 12px}p{color:var(--text-2);font-size:13px;line-height:1.5}label{display:block;font-size:12px;margin-bottom:6px}input{width:100%;margin-bottom:12px}button{width:100%;padding:8px;border:0;border-radius:6px;background:var(--text);color:var(--surface)}button:disabled{opacity:.6}</style></head><body><main><h1>Open Paper</h1><p id="status" role="status">Opening your invitation…</p><form hidden><label for="invite">Invitation link or key</label><input class="field" id="invite" autocomplete="off" spellcheck="false" type="password" required><button type="submit">Open Paper</button></form></main><script type="module">
const status=document.getElementById('status'),form=document.querySelector('form'),field=document.getElementById('invite'),button=form.querySelector('button');
const token=location.hash.slice(1);history.replaceState(null,'','/join');
async function join(value){button.disabled=true;status.textContent='Opening your invitation…';try{if(value.includes('#'))value=value.slice(value.lastIndexOf('#')+1);const response=await fetch('/api/join',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:value.trim()})}),data=await response.json();if(!response.ok)throw new Error(data.error||'The invitation could not be opened.');location.replace(data.href);}catch(error){status.textContent=error.message;form.hidden=false;field.value='';}finally{button.disabled=false;}}
form.addEventListener('submit',e=>{e.preventDefault();join(field.value);});if(token)join(token);else{status.textContent='Use the invitation link or key from the owner.';form.hidden=false;}
</script></body></html>
