<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Open Paper</title><link rel="icon" href="data:,"><link rel="help" type="text/markdown" href="agent.md" title="OpenPaperDesign agent guide"><link rel="describedby" type="application/json" href="agent.json" title="OpenPaperDesign agent manifest"><link rel="stylesheet" href="chrome.css"><style>
body{min-height:100dvh;display:grid;place-items:center;align-content:center;margin:0;background:var(--canvas);color:var(--text);font:14px/1.55 Inter,system-ui,sans-serif}main{box-sizing:border-box;width:min(460px,calc(100vw - 32px));padding:28px;border:1px solid var(--line);border-radius:16px;background:var(--surface);box-shadow:var(--shadow)}h1{font-size:22px;line-height:1.3;margin:0 0 12px;overflow-wrap:anywhere}p{color:var(--text-2);margin:12px 0}#status[data-state=problem]{color:var(--danger)}label{display:block;margin-bottom:8px}input,textarea{box-sizing:border-box;width:100%;margin:8px 0 14px;font:inherit}input{height:38px}textarea{min-height:76px;padding:8px 10px;resize:vertical}#code{font-size:18px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}#code::placeholder{font-weight:400;letter-spacing:.08em}button,.action{box-sizing:border-box;display:flex;align-items:center;justify-content:center;width:100%;min-height:40px;padding:9px 12px;border:1px solid var(--line);border-radius:7px;background:var(--field);color:var(--text);font:inherit;text-decoration:none;cursor:pointer}.primary{background:var(--selected);color:var(--accent-ink)}button:disabled{opacity:.5;cursor:default}footer{width:min(460px,calc(100vw - 32px));margin-top:14px;font-size:11px;line-height:1.5;color:var(--text-3);text-align:center}footer a{color:inherit;text-underline-offset:3px}#opening{font-size:13px}#opening a{color:var(--accent-ink)}.install a{color:inherit;text-underline-offset:3px}form{margin-top:20px}.hint{font-size:12px;margin:-6px 0 14px}[hidden]{display:none!important}@media(max-width:400px){main{padding:22px}}
</style></head><body><main><h1 id="name">Shared Paper</h1><p id="status" role="status" aria-live="polite">Checking your invitation…</p><p id="opening" hidden>If nothing happens, <a id="open-now">open the Paper</a>.</p><form id="code-form" hidden novalidate><label for="code">Access code<input id="code" name="code" type="text" inputmode="text" autocomplete="one-time-code" autocapitalize="characters" autocorrect="off" spellcheck="false" maxlength="64" placeholder="XXXX-XXXX" aria-describedby="code-hint"></label><p id="code-hint" class="hint">Letters and numbers only. Spaces, dashes and capitals do not matter.</p><button id="unlock" class="primary" type="submit">Unlock</button></form><form id="link-form" hidden novalidate><label for="invite">Invitation<textarea id="invite" name="invite" autocomplete="off" spellcheck="false" rows="3" placeholder="Paste the link, or the whole message you received"></textarea></label><button id="link-submit" type="submit">Continue</button></form></main><footer>For AI agents: <a href="agent.md">agent guide</a> and <a href="agent.json">manifest</a> (public product information; fetching this page sends no key and opens no Paper).</footer><script type="module" src="join.js"></script></body></html>
