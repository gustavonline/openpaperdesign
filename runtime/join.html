<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Open Paper</title><link rel="icon" href="data:,"><link rel="stylesheet" href="chrome.css"><style>
body{min-height:100dvh;display:grid;place-items:center;margin:0;background:var(--bg);color:var(--text);font:14px/1.55 Inter,system-ui,sans-serif}main{box-sizing:border-box;width:min(460px,calc(100vw - 32px));padding:28px;border:1px solid var(--line);border-radius:16px;background:var(--surface);box-shadow:var(--shadow)}h1{font-size:22px;line-height:1.3;margin:0 0 12px;overflow-wrap:anywhere}p{color:var(--text-2);margin:12px 0}label{display:block;margin-bottom:8px}input{box-sizing:border-box;width:100%;height:38px;margin:8px 0 14px;font:inherit}button,.action{box-sizing:border-box;display:flex;align-items:center;justify-content:center;width:100%;min-height:40px;padding:9px 12px;border:1px solid var(--line);border-radius:7px;background:var(--field);color:var(--text);font:inherit;text-decoration:none;cursor:pointer}.primary{background:var(--selected);color:var(--accent-ink)}button:disabled{opacity:.5}.apps{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}.install{font-size:13px;margin-top:18px}.install a{color:inherit;text-underline-offset:3px}form{margin-top:20px}[hidden]{display:none!important}@media(max-width:400px){main{padding:22px}.apps{grid-template-columns:1fr}}
</style></head><body><main><h1 id="name">Open Paper</h1><p id="status" role="status">Checking your invitation…</p><section id="choices" hidden><a id="browser" class="action primary">Open in browser</a><div class="apps"><a id="codex" class="action">Open in Codex</a><a id="claude" class="action">Open in Claude Code</a></div><p class="install">Desktop options use the <a href="https://github.com/gustavonline/openpaperdesign#install" target="_blank" rel="noopener noreferrer">OpenPaperDesign plugin</a>. You can always use the browser.</p></section><form hidden><label for="invite">Invitation link<input class="field" id="invite" autocomplete="off" spellcheck="false" type="password" required></label><button type="submit">Open invitation</button></form></main><script type="module" src="join.js"></script></body></html>
